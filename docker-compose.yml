services:
  agent:
    build: ./agent
    environment:
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LM_STUDIO_MODEL: qwen/qwen3-vl-8b

  api:
    build: ./api
    environment:
      AGENT_URL: http://agent:8001/test/action
    depends_on:
      - agent
    ports:
      - "8000:8000"

  cli:
    build: ./cli
    stdin_open: true
    tty: true
    environment:
      API_URL: http://api:8000/test/relay
    depends_on:
      - api
