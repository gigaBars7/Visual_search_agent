services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LM_STUDIO_MODEL: qwen/qwen3-vl-8b
      PHOTOS_ROOT: /photos
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${PHOTO_ROOT:?Run start.bat or set PHOTO_ROOT}:/photos:ro
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: ./api
    depends_on:
      - agent
    ports:
      - "8000:8000"

  cli:
    build: ./cli
    stdin_open: true
    tty: true
    depends_on:
      - api

volumes:
  qdrant_data:
